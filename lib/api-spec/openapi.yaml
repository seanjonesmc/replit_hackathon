openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser sign-in endpoints.
  - name: Family
    description: >-
      The single demo family, its simulated banks and its buckets. Every route
      requires sign-in. The API acts for whichever member the request names;
      any signed-in account can act for the demo family. The `/family/*` reads
      are each shaped for one screen. Amounts are integer cents.
  - name: Spending
    description: >-
      The dependent's card, the simulated merchants, the decision engine
      (swipes), the activity feed and pending approvals, and the family's
      spending policy. Every route requires sign-in.
  - name: Demo
    description: >-
      Presenter controls for rehearsing the demo script. Every route requires
      sign-in.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently signed-in user
      description: "Returns the signed-in user, or `user: null` when signed out."
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /family:
    get:
      tags: [Family]
      operationId: getFamily
      summary: Get the demo family and its members
      description: The family and every member with their role. Feeds the role switcher.
      responses:
        "200":
          description: The demo family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /overview:
    get:
      tags: [Family]
      operationId: getOverview
      summary: Get the family pot and its buckets
      description: >-
        The pot totals plus each bucket's available, held and spent amounts,
        per-purchase limit and approval threshold. All amounts are integer cents.
      responses:
        "200":
          description: The pot overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /members/{memberId}/bank-accounts:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      tags: [Family]
      operationId: listMemberBankAccounts
      summary: List a member's linked demo banks
      responses:
        "200":
          description: The member's linked banks with their balances.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Family]
      operationId: linkBankAccount
      summary: Link a simulated demo bank for a member
      description: >-
        The bank name must be one of the brand's demo banks. The last four
        digits are generated. Only a parent or funder can link a bank, and each
        demo bank can be linked once per member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkBankAccountRequest"
      responses:
        "201":
          description: The newly linked bank, with a zero balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /bank-accounts/{bankAccountId}/deposits:
    parameters:
      - $ref: "#/components/parameters/BankAccountId"
    post:
      tags: [Family]
      operationId: createBankDeposit
      summary: Make a simulated deposit into a linked bank
      description: Stands in for an ACH deposit; raises the bank balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositRequest"
      responses:
        "201":
          description: The deposit and the bank's new balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /buckets/{bucketId}/contributions:
    parameters:
      - $ref: "#/components/parameters/BucketId"
    post:
      tags: [Family]
      operationId: createContribution
      summary: Move money from a member's bank into a bucket
      description: >-
        The named member (a parent or funder) moves money from one of their
        linked banks into the bucket. Rejected with 422 and a clear message if
        the bank balance is too low or the bank is not theirs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionRequest"
      responses:
        "201":
          description: The contribution, plus the bank and bucket after the move.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /buckets/{bucketId}/send-money:
    parameters:
      - $ref: "#/components/parameters/BucketId"
    post:
      tags: [Family]
      operationId: sendMoneyToBucket
      summary: Deposit into a member's bank and move it into a bucket, in one step
      description: >-
        The named member (a parent or funder) sends money from their bank: a
        simulated deposit, then a contribution of the same amount into the
        bucket, in one database transaction. Both are then mirrored on the
        testnet in the background; the response never waits for the chain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionRequest"
      responses:
        "201":
          description: The deposit, the contribution, and the bank and bucket after the move.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMoneyResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /members/{memberId}/contributions:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      tags: [Family]
      operationId: listMemberContributions
      summary: List one member's contributions
      description: Newest first, with the bucket and bank each came from.
      responses:
        "200":
          description: The member's contributions and their total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberContributions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /swipes:
    post:
      tags: [Spending]
      operationId: createSwipe
      summary: Swipe the simulated card through the decision engine
      description: >-
        Runs the hard rules in order (the first match decides), then the AI
        guard only for swipes the rules can't place in a bucket or whose items
        look suspicious. Stores the authorization and, when approved, holds the
        amount in its bucket (available → held); nothing is paid until a
        settlement run (`POST /settlements`) moves it held → spent. Rejected and
        pending swipes move no money. For seeded merchants the stored name,
        category and MCC are used instead of the values sent. Never waits on the
        chain: the chain status starts as `not_submitted`, and `authorize` is
        sent to the testnet in the background.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwipeRequest"
      responses:
        "201":
          description: The decision and the stored authorization's id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwipeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /settlements:
    post:
      tags: [Spending]
      operationId: runSettlement
      summary: Settle every held purchase (demo control)
      description: >-
        A demo-only control the presenter triggers. Moves every held purchase
        held → spent in one transaction and returns the run with three steps
        per purchase: the card network paid the merchant in dollars from the
        card issuer's account (simulated), the vault released the held tokens
        to the card issuer (on the testnet, sent in the background as
        `capture`), and the issuer redeemed them with the partner bank for
        dollars (simulated). Responds 422 when nothing is held.
      responses:
        "201":
          description: The settlement run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settlement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /settlements/{settlementId}:
    get:
      tags: [Spending]
      operationId: getSettlement
      summary: One settlement run, with each capture's current chain status
      parameters:
        - $ref: "#/components/parameters/SettlementId"
      responses:
        "200":
          description: The settlement run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settlement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /demo/reset:
    post:
      tags: [Demo]
      operationId: resetDemo
      summary: Reset the demo to the script's starting point (parent only)
      description: >-
        In one database transaction, deletes the demo family and everything a
        run created (contributions, deposits, held and settled purchases,
        settlement runs, temporary passes, policy and card changes), then
        re-runs the seed. Afterwards no purchase is held, nothing from the
        script has happened yet, and every amount on screen matches the seed.
        Member, bank, bucket and purchase ids all change. Nothing on chain is
        undone; the fresh rows carry no chain records, so explorer links from
        earlier runs are no longer shown. Only the family's parent can reset,
        under the same rule as answering a purchase: 403 for anyone else, or
        when that parent is linked to a different account. Accounts linked to
        members stay linked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoResetRequest"
      responses:
        "200":
          description: The demo was reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoResetResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /merchants:
    get:
      tags: [Spending]
      operationId: listMerchants
      summary: List the seeded merchants
      description: The simulated merchants for the swipe grid, in seed order.
      responses:
        "200":
          description: The merchants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Merchant"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /authorizations:
    get:
      tags: [Spending]
      operationId: listAuthorizations
      summary: The activity feed
      description: >-
        Every swipe for the demo family, newest first, with merchant and bucket
        names and the links of any approval chain.
      parameters:
        - name: limit
          in: query
          required: false
          description: How many rows to return (newest first).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The authorizations, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Authorization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /approvals:
    get:
      tags: [Spending]
      operationId: listApprovals
      summary: Pending authorizations waiting for a parent
      responses:
        "200":
          description: Pending authorizations, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Authorization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /authorizations/{authorizationId}:
    parameters:
      - $ref: "#/components/parameters/AuthorizationId"
    get:
      tags: [Spending]
      operationId: getAuthorization
      summary: One swipe and the retry after a parent's OK
      description: >-
        For a screen waiting on a parent's answer: the swipe as it stands now
        and, once a parent approves it, the automatic retry and its decision.
      responses:
        "200":
          description: The swipe and its retry, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationThread"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /approvals/{authorizationId}/resolve:
    parameters:
      - $ref: "#/components/parameters/AuthorizationId"
    post:
      tags: [Spending]
      operationId: resolveApproval
      summary: A parent approves or declines a pending swipe
      description: >-
        Approve grants a one-time pass for that merchant and amount (10
        minutes) and re-runs the same purchase through the decision engine at
        once, as a new authorization linked to this one. Decline marks the
        request declined and moves no money. Only a parent may answer, and
        only from the signed-in account linked to that parent; an unlinked
        demo parent can be answered for by the signed-in presenter unless that
        account is linked to another member (403 otherwise). A request that
        was already answered gets 409. The
        decision and the pass are mirrored on the testnet in the background;
        the response never waits for the chain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveApprovalRequest"
      responses:
        "200":
          description: The answered request and, after an approval, its retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationThread"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /card:
    get:
      tags: [Spending]
      operationId: getCard
      summary: Get the dependent's card
      responses:
        "200":
          description: The card and its status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /card/freeze:
    post:
      tags: [Spending]
      operationId: freezeCard
      summary: Freeze the dependent's card
      description: >-
        Active → frozen; freezing a frozen card changes nothing. Every swipe on
        a frozen card is rejected with `card_inactive`. Database only for now.
      responses:
        "200":
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /card/unfreeze:
    post:
      tags: [Spending]
      operationId: unfreezeCard
      summary: Unfreeze the dependent's card
      description: >-
        Frozen → active; unfreezing an active card changes nothing. Database
        only for now.
      responses:
        "200":
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /policy:
    get:
      tags: [Spending]
      operationId: getPolicy
      summary: Get the family's spending policy
      description: >-
        The policy in FamilyPolicy shape (each bucket with its per-purchase
        limit and approval threshold), plus the preset it started from and the
        time zone its time windows are read in.
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /family/overview:
    get:
      tags: [Family]
      operationId: getParentOverview
      summary: Parent home — total pot, bucket cards and pending approvals count
      responses:
        "200":
          description: Parent home data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /family/buckets:
    get:
      tags: [Family]
      operationId: listBuckets
      summary: Every bucket with its balances and limits
      responses:
        "200":
          description: Buckets in display order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BucketSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /family/activity:
    get:
      tags: [Family]
      operationId: listActivity
      summary: Plain-English activity feed, newest first
      responses:
        "200":
          description: Activity rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /family/card-policy:
    get:
      tags: [Family]
      operationId: getCardAndPolicy
      summary: The dependent's virtual card, the current policy and blocked categories
      responses:
        "200":
          description: Card and policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardAndPolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /family/wallet:
    get:
      tags: [Family]
      operationId: getDependentWallet
      summary: Dependent wallet — virtual card, total balance and balance per bucket
      responses:
        "200":
          description: Wallet data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependentWallet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /family/insights:
    get:
      tags: [Family]
      operationId: getSpendingInsights
      summary: Spending numbers for one period, for the whole family or one dependent
      description: >-
        Server-computed spending KPIs. "Spent" is approved purchases, held or
        settled; a parent-approved retry counts once, as its final swipe.
        "Stopped" is declined purchases (by the rules or a parent). Pending
        purchases count toward neither. Days and periods follow the family's
        clock. The bucket usage section is all time and family wide, since
        buckets are shared. Nothing here reads the chain.
      parameters:
        - name: period
          in: query
          required: false
          description: >-
            `7d` and `30d` are the last 7 or 30 days on the family's clock,
            today included. `all` is all time (no previous-period comparison).
          schema:
            $ref: "#/components/schemas/InsightsPeriod"
        - name: dependentId
          in: query
          required: false
          description: Only this dependent's purchases. Omit for every dependent.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: The spending insights.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendingInsights"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /members/{memberId}/funding-insights:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      tags: [Family]
      operationId: getFundingInsights
      summary: One funder's contributions by bucket and their share of the family's funding
      description: >-
        Contributions are pooled in shared buckets, so this reports what the
        member put into each bucket and what has been spent from those buckets
        overall. It never claims which purchases their exact dollars paid for.
      responses:
        "200":
          description: The member's funding insights.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingInsights"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    BankAccountId:
      name: bankAccountId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    BucketId:
      name: bucketId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    SettlementId:
      name: settlementId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    AuthorizationId:
      name: authorizationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  responses:
    BadRequest:
      description: The path parameters or request body are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The named family, member, bank account or bucket does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The request duplicates something that already exists, or answers a request that was already answered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unprocessable:
      description: The request is well-formed but breaks a rule, e.g. the bank balance is too low.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Signed in, but this account may not act as the named family member.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Not signed in. Returned by every route behind the require-sign-in guard.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    InsightsPeriod:
      type: string
      enum: ["7d", "30d", "all"]
    InsightsDependent:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: integer
        displayName:
          type: string
    InsightsBucketSpend:
      type: object
      required: [bucketId, bucketName, icon, spentCents, purchaseCount, share]
      properties:
        bucketId:
          type: [integer, "null"]
          description: Null for approved purchases whose bucket no longer exists.
        bucketName:
          type: string
        icon:
          oneOf:
            - $ref: "#/components/schemas/BucketIcon"
            - type: "null"
        spentCents:
          type: integer
        purchaseCount:
          type: integer
        share:
          type: number
          description: Share of the period's spending, 0–1 (0 when nothing was spent).
    InsightsDependentSpend:
      type: object
      required: [dependentId, dependentName, spentCents, purchaseCount, declinedCount, declinedCents, share]
      properties:
        dependentId:
          type: integer
        dependentName:
          type: string
        spentCents:
          type: integer
        purchaseCount:
          type: integer
        declinedCount:
          type: integer
        declinedCents:
          type: integer
        share:
          type: number
          description: Share of the period's spending, 0–1.
    InsightsDay:
      type: object
      required: [date, spentCents]
      properties:
        date:
          type: string
          description: The family-clock calendar day, YYYY-MM-DD.
        spentCents:
          type: integer
    InsightsMerchant:
      type: object
      required: [merchantName, spentCents, purchaseCount]
      properties:
        merchantName:
          type: string
        spentCents:
          type: integer
        purchaseCount:
          type: integer
    InsightsBucketUsage:
      type: object
      required: [bucketId, bucketName, icon, fundedCents, spentCents, heldCents, availableCents]
      properties:
        bucketId:
          type: integer
        bucketName:
          type: string
        icon:
          oneOf:
            - $ref: "#/components/schemas/BucketIcon"
            - type: "null"
        fundedCents:
          type: integer
          description: Total ever added, all time.
        spentCents:
          type: integer
          description: Settled, all time.
        heldCents:
          type: integer
          description: Approved but not settled yet.
        availableCents:
          type: integer
    SpendingInsights:
      type: object
      required:
        - period
        - periodStart
        - periodEnd
        - timeZone
        - dependentId
        - dependents
        - spentCents
        - previousPeriodSpentCents
        - purchaseCount
        - averagePurchaseCents
        - decidedCount
        - approvalRate
        - declinedCount
        - declinedCents
        - pendingCount
        - byBucket
        - byDependent
        - daily
        - topMerchants
        - bucketUsage
      properties:
        period:
          $ref: "#/components/schemas/InsightsPeriod"
        periodStart:
          type: [string, "null"]
          format: date-time
          description: Start of the period (family-clock midnight); null for all time.
        periodEnd:
          type: string
          format: date-time
        timeZone:
          type: string
          description: The family's clock, e.g. America/Los_Angeles.
        dependentId:
          type: [integer, "null"]
          description: The dependent filter, or null for every dependent.
        dependents:
          type: array
          description: Every dependent in the family, for the filter. Demo dependent first.
          items:
            $ref: "#/components/schemas/InsightsDependent"
        spentCents:
          type: integer
          description: Approved purchases in the period, held or settled, each counted once.
        previousPeriodSpentCents:
          type: [integer, "null"]
          description: >-
            Spent in the same-length period just before; null for all time or
            when nothing was spent then.
        purchaseCount:
          type: integer
          description: Approved purchases in the period.
        averagePurchaseCents:
          type: [integer, "null"]
          description: Spent divided by purchases, rounded; null with no purchases.
        decidedCount:
          type: integer
          description: Approved plus declined purchases.
        approvalRate:
          type: [number, "null"]
          description: Approved out of decided, 0–1; null when nothing was decided.
        declinedCount:
          type: integer
        declinedCents:
          type: integer
          description: Dollars stopped (declined by the rules or a parent).
        pendingCount:
          type: integer
          description: Still waiting on a parent; counted as neither spent nor stopped.
        byBucket:
          type: array
          description: Every bucket in display order, plus any purchases with no bucket.
          items:
            $ref: "#/components/schemas/InsightsBucketSpend"
        byDependent:
          type: array
          description: Every dependent in the filter, demo dependent first.
          items:
            $ref: "#/components/schemas/InsightsDependentSpend"
        daily:
          type: array
          description: >-
            One entry per family-clock day of the period, oldest first. For
            all time it starts on the first day with a purchase; empty with none.
          items:
            $ref: "#/components/schemas/InsightsDay"
        topMerchants:
          type: array
          description: Up to five merchants by amount spent.
          items:
            $ref: "#/components/schemas/InsightsMerchant"
        bucketUsage:
          type: array
          description: Each bucket's funding, spent and held money. All time, family wide.
          items:
            $ref: "#/components/schemas/InsightsBucketUsage"
    FundingBucketShare:
      type: object
      required: [bucketId, bucketName, icon, contributedCents, share, bucketFundedCents, bucketSpentCents, bucketHeldCents]
      properties:
        bucketId:
          type: integer
        bucketName:
          type: string
        icon:
          oneOf:
            - $ref: "#/components/schemas/BucketIcon"
            - type: "null"
        contributedCents:
          type: integer
          description: What this member added to the bucket.
        share:
          type: number
          description: Share of this member's own contributions, 0–1.
        bucketFundedCents:
          type: integer
          description: Everything anyone added to the bucket.
        bucketSpentCents:
          type: integer
          description: Settled from the bucket, all time, whoever's money it was.
        bucketHeldCents:
          type: integer
    FundingInsights:
      type: object
      required:
        - memberId
        - contributedCents
        - familyFundedCents
        - shareOfFamilyFunding
        - spentFromFundedBucketsCents
        - heldInFundedBucketsCents
        - byBucket
      properties:
        memberId:
          type: integer
        contributedCents:
          type: integer
        familyFundedCents:
          type: integer
          description: Everything anyone added to the family's buckets.
        shareOfFamilyFunding:
          type: [number, "null"]
          description: This member's part of the family's total funding, 0–1; null when nothing was added.
        spentFromFundedBucketsCents:
          type: integer
          description: Settled from the buckets this member added to, all time. Pooled money.
        heldInFundedBucketsCents:
          type: integer
        byBucket:
          type: array
          description: Buckets this member added to, in display order.
          items:
            $ref: "#/components/schemas/FundingBucketShare"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ChainStatus:
      type: string
      description: >-
        Where the record stands on the testnet. Only `confirmed` (set from a
        transaction receipt) may be shown as verified.
      enum: [not_submitted, submitted, confirmed, failed]
    ChainRecord:
      type: object
      required: [status, txHash, confirmedAt, explorerUrl]
      properties:
        status:
          $ref: "#/components/schemas/ChainStatus"
        txHash:
          type: [string, "null"]
        confirmedAt:
          type: [string, "null"]
          format: date-time
        explorerUrl:
          type: [string, "null"]
          description: >-
            The transaction on the testnet block explorer. Set only once the
            transaction is confirmed; null otherwise.
    MemberRole:
      type: string
      enum: [parent, funder, dependent]
    Member:
      type: object
      required: [id, displayName, role, relationship, age, onboardingComplete, onchainId]
      properties:
        id:
          type: integer
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
        relationship:
          type: string
          description: e.g. parent, grandparent, co-parent, student.
        age:
          type: [integer, "null"]
        onboardingComplete:
          type: boolean
        onchainId:
          type: string
          description: The member's fixed 32-byte contract id, 0x-prefixed hex.
    Family:
      type: object
      required: [id, name, members]
      properties:
        id:
          type: integer
        name:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    Bucket:
      type: object
      required:
        - id
        - name
        - perPurchaseLimitCents
        - approvalThresholdCents
        - availableCents
        - heldCents
        - spentCents
        - chain
      properties:
        id:
          type: integer
        name:
          type: string
        perPurchaseLimitCents:
          type: integer
        approvalThresholdCents:
          type: integer
        availableCents:
          type: integer
        heldCents:
          type: integer
          description: Authorized but not yet settled.
        spentCents:
          type: integer
        chain:
          $ref: "#/components/schemas/ChainRecord"
    PotTotals:
      type: object
      required: [potCents, availableCents, heldCents, spentCents]
      properties:
        potCents:
          type: integer
          description: Money still in the pot, available plus held.
        availableCents:
          type: integer
        heldCents:
          type: integer
        spentCents:
          type: integer
    Overview:
      type: object
      required: [familyId, totals, buckets]
      properties:
        familyId:
          type: integer
        totals:
          $ref: "#/components/schemas/PotTotals"
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/Bucket"
    BankAccount:
      type: object
      required: [id, memberId, bankName, last4, balanceCents, chain]
      properties:
        id:
          type: integer
        memberId:
          type: integer
        bankName:
          type: string
        last4:
          type: string
        balanceCents:
          type: integer
        chain:
          $ref: "#/components/schemas/ChainRecord"
    LinkBankAccountRequest:
      type: object
      required: [bankName]
      properties:
        bankName:
          type: string
          minLength: 1
          description: One of the brand's demo banks.
    DepositRequest:
      type: object
      required: [amountCents]
      properties:
        amountCents:
          type: integer
          minimum: 1
          maximum: 1000000
    BankDeposit:
      type: object
      required: [id, bankAccountId, amountCents, createdAt, chain]
      properties:
        id:
          type: integer
        bankAccountId:
          type: integer
        amountCents:
          type: integer
        createdAt:
          type: string
          format: date-time
        chain:
          $ref: "#/components/schemas/ChainRecord"
    DepositResult:
      type: object
      required: [deposit, bankAccount]
      properties:
        deposit:
          $ref: "#/components/schemas/BankDeposit"
        bankAccount:
          $ref: "#/components/schemas/BankAccount"
    ContributionRequest:
      type: object
      required: [memberId, bankAccountId, amountCents]
      properties:
        memberId:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: The parent or funder moving the money.
        bankAccountId:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: One of that member's linked banks.
        amountCents:
          type: integer
          minimum: 1
          maximum: 1000000
        note:
          type: [string, "null"]
          maxLength: 140
          description: >-
            Shown with the contribution. Empty or missing becomes
            "<bucket>, from <funder name>".
    Contribution:
      type: object
      required:
        - id
        - memberId
        - bucketId
        - bucketName
        - bankAccountId
        - bankName
        - bankLast4
        - amountCents
        - note
        - createdAt
        - chain
      properties:
        id:
          type: integer
        memberId:
          type: integer
        bucketId:
          type: integer
        bucketName:
          type: string
        bankAccountId:
          type: integer
        bankName:
          type: string
        bankLast4:
          type: string
        amountCents:
          type: integer
        note:
          type: string
          description: The funder's note, or "<bucket>, from <funder name>".
        createdAt:
          type: string
          format: date-time
        chain:
          $ref: "#/components/schemas/ChainRecord"
    ContributionResult:
      type: object
      required: [contribution, bankAccount, bucket]
      properties:
        contribution:
          $ref: "#/components/schemas/Contribution"
        bankAccount:
          $ref: "#/components/schemas/BankAccount"
        bucket:
          $ref: "#/components/schemas/Bucket"
    DemoResetRequest:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: The parent asking for the reset.
    DemoResetResult:
      type: object
      required: [familyId, historyAdded, resetAt]
      properties:
        familyId:
          type: integer
          description: The re-seeded family's new id.
        historyAdded:
          type: integer
          description: How many seeded purchases were recorded again.
        resetAt:
          type: string
          format: date-time
    SendMoneyResult:
      type: object
      required: [deposit, contribution, bankAccount, bucket]
      properties:
        deposit:
          $ref: "#/components/schemas/BankDeposit"
        contribution:
          $ref: "#/components/schemas/Contribution"
        bankAccount:
          $ref: "#/components/schemas/BankAccount"
        bucket:
          $ref: "#/components/schemas/Bucket"
    MemberContributions:
      type: object
      required: [memberId, totalCents, contributions]
      properties:
        memberId:
          type: integer
        totalCents:
          type: integer
        contributions:
          type: array
          items:
            $ref: "#/components/schemas/Contribution"
    Decision:
      type: string
      enum: [APPROVED, REJECTED, PENDING]
    ReasonCode:
      type: string
      description: Matches the contract's reason codes.
      enum:
        - approved
        - blocked_category
        - insufficient_funds
        - over_limit
        - card_inactive
        - needs_approval
        - outside_hours
    DecidedBy:
      type: string
      enum: [Rule, AI guard]
    AuthorizationStatus:
      type: string
      description: >-
        Where the swipe stands now. A pending swipe stays `pending` until a
        parent resolves it; the retry after a parent's OK is a new, linked
        authorization.
      enum: [approved, rejected, pending, parent_approved, parent_declined]
    SwipeRequest:
      type: object
      description: >-
        The spec's swipe payload. For a seeded merchant (merchantId set) the
        stored name, category and MCC replace the values sent.
      required:
        - cardId
        - dependentId
        - merchantName
        - mcc
        - merchantCategory
        - items
        - amount
        - location
        - timestamp
      properties:
        cardId:
          type: integer
          minimum: 1
          maximum: 2147483647
        dependentId:
          type: integer
          minimum: 1
          maximum: 2147483647
        merchantId:
          type: [integer, "null"]
          minimum: 1
          maximum: 2147483647
          description: A seeded merchant's id; omit or null for a custom swipe.
        merchantName:
          type: string
          minLength: 1
          maxLength: 120
        mcc:
          type: string
          pattern: "^[0-9]{4}$"
          description: Four-digit merchant category code, e.g. 5411.
        merchantCategory:
          type: string
          minLength: 1
          maxLength: 60
          description: Plain category, e.g. grocery, bar or rideshare.
        items:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 80
        amount:
          type: integer
          minimum: 1
          maximum: 1000000
          description: The purchase amount in integer cents.
        location:
          type: string
          maxLength: 200
        timestamp:
          type: string
          minLength: 16
          maxLength: 40
          description: >-
            When the card was swiped, ISO 8601, e.g. 2026-10-24T02:10:00-07:00.
            Without an offset it is read as the family's local time. Time
            windows are checked in the family's time zone.
    SwipeResult:
      type: object
      required:
        - authorizationId
        - decision
        - reasonCode
        - reason
        - decidedBy
        - aiConfidence
        - bucketId
        - bucketName
        - decisionMs
        - trace
        - chain
      properties:
        authorizationId:
          type: integer
        decision:
          $ref: "#/components/schemas/Decision"
        reasonCode:
          $ref: "#/components/schemas/ReasonCode"
        reason:
          type: string
          description: One short sentence a teenager would understand.
        decidedBy:
          $ref: "#/components/schemas/DecidedBy"
        aiConfidence:
          type: [number, "null"]
          description: The AI guard's confidence (0–1) when it decided.
        bucketId:
          type: [integer, "null"]
        bucketName:
          type: [string, "null"]
        decisionMs:
          type: number
          description: Measured rule evaluation time, plus the AI guard's when it ran.
        trace:
          type: array
          description: What happened during the swipe, in order, in plain words.
          items:
            $ref: "#/components/schemas/SwipeTraceStep"
        chain:
          $ref: "#/components/schemas/ChainRecord"
    SwipeTraceStep:
      type: object
      required: [label, state]
      properties:
        label:
          type: string
        state:
          type: string
          description: >-
            `done` for a hand-off step, `held` when money was held, `skipped`
            when nothing was held, and the decision for the last step.
          enum: [done, held, skipped, approved, rejected, pending]
    SettlementState:
      type: string
      description: >-
        Where an approved purchase's money stands: `held` (approved, not paid
        yet) or `settled` (held → spent, the card issuer repaid). Null for a
        swipe that moved no money.
      enum: [held, settled]
    SettlementStep:
      type: object
      required: [key, label, detail, simulated, chain]
      properties:
        key:
          type: string
          enum: [network_paid_merchant, vault_paid_issuer, issuer_redeemed]
        label:
          type: string
        detail:
          type: string
        simulated:
          type: boolean
          description: True for a step nothing real performs (no card network or bank).
        chain:
          description: The testnet transaction behind the step, for the vault step only.
          oneOf:
            - $ref: "#/components/schemas/ChainRecord"
            - type: "null"
    SettledPurchase:
      type: object
      required: [authorizationId, merchantName, bucketName, amountCents, swipedAt, steps]
      properties:
        authorizationId:
          type: integer
        merchantName:
          type: string
        bucketName:
          type: [string, "null"]
        amountCents:
          type: integer
        swipedAt:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/SettlementStep"
    Settlement:
      type: object
      required: [id, settledAt, purchaseCount, totalCents, issuerAddress, issuerExplorerUrl, purchases]
      properties:
        id:
          type: integer
        settledAt:
          type: string
          format: date-time
        purchaseCount:
          type: integer
        totalCents:
          type: integer
        issuerAddress:
          type: string
          description: The card issuer's testnet wallet that captures pay.
        issuerExplorerUrl:
          type: string
        purchases:
          type: array
          items:
            $ref: "#/components/schemas/SettledPurchase"
    Authorization:
      type: object
      required:
        - id
        - cardId
        - dependentId
        - merchantId
        - merchantName
        - mcc
        - merchantCategory
        - items
        - amountCents
        - location
        - swipedAt
        - bucketId
        - bucketName
        - decision
        - status
        - reasonCode
        - reason
        - decidedBy
        - aiConfidence
        - decisionMs
        - previousAuthorizationId
        - nextAuthorizationId
        - resolvedAt
        - settledAt
        - settlement
        - settlementId
        - issuerRedeemedAt
        - trace
        - createdAt
        - chain
        - captureChain
        - resolveChain
      properties:
        id:
          type: integer
        cardId:
          type: [integer, "null"]
        dependentId:
          type: integer
        merchantId:
          type: [integer, "null"]
        merchantName:
          type: string
        mcc:
          type: string
        merchantCategory:
          type: string
        items:
          type: array
          items:
            type: string
        amountCents:
          type: integer
        location:
          type: string
        swipedAt:
          type: string
          format: date-time
        bucketId:
          type: [integer, "null"]
        bucketName:
          type: [string, "null"]
        decision:
          $ref: "#/components/schemas/Decision"
        status:
          $ref: "#/components/schemas/AuthorizationStatus"
        reasonCode:
          $ref: "#/components/schemas/ReasonCode"
        reason:
          type: string
        decidedBy:
          $ref: "#/components/schemas/DecidedBy"
        aiConfidence:
          type: [number, "null"]
        decisionMs:
          type: number
        previousAuthorizationId:
          type: [integer, "null"]
          description: The earlier authorization in an approval chain that this one retries.
        nextAuthorizationId:
          type: [integer, "null"]
          description: The later authorization that retried this one, if any.
        resolvedAt:
          type: [string, "null"]
          format: date-time
          description: When a parent approved or declined this pending swipe.
        settledAt:
          type: [string, "null"]
          format: date-time
          description: When the held money moved to spent and the card issuer was repaid.
        settlement:
          oneOf:
            - $ref: "#/components/schemas/SettlementState"
            - type: "null"
        settlementId:
          type: [integer, "null"]
          description: The settlement run that settled it (null for seeded history).
        issuerRedeemedAt:
          type: [string, "null"]
          format: date-time
          description: When the card issuer redeemed the tokens with the partner bank (simulated).
        trace:
          type: array
          items:
            $ref: "#/components/schemas/SwipeTraceStep"
        createdAt:
          type: string
          format: date-time
        chain:
          $ref: "#/components/schemas/ChainRecord"
        captureChain:
          description: The capture that repaid the card issuer at settlement.
          $ref: "#/components/schemas/ChainRecord"
        resolveChain:
          $ref: "#/components/schemas/ChainRecord"
    AuthorizationThread:
      type: object
      required: [authorization, retry]
      properties:
        authorization:
          $ref: "#/components/schemas/Authorization"
        retry:
          description: The automatic retry after a parent's OK; null until then, or after a decline.
          oneOf:
            - $ref: "#/components/schemas/Authorization"
            - type: "null"
    ResolveApprovalRequest:
      type: object
      required: [parentId, decision]
      properties:
        parentId:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: The parent answering; must be a parent in the family.
        decision:
          type: string
          enum: [approve, decline]
    Merchant:
      type: object
      required: [id, name, mcc, category, onchainId, chain]
      properties:
        id:
          type: integer
        name:
          type: string
        mcc:
          type: string
        category:
          type: string
        onchainId:
          type: string
          description: The merchant's fixed 32-byte contract id, 0x-prefixed hex.
        chain:
          $ref: "#/components/schemas/ChainRecord"
    CardStatus:
      type: string
      enum: [issued, active, frozen]
    Card:
      type: object
      required:
        - id
        - dependentId
        - dependentName
        - last4
        - expiryMonth
        - expiryYear
        - status
        - onchainCardId
        - chain
      properties:
        id:
          type: integer
        dependentId:
          type: integer
        dependentName:
          type: string
        last4:
          type: string
        expiryMonth:
          type: integer
        expiryYear:
          type: integer
        status:
          $ref: "#/components/schemas/CardStatus"
        onchainCardId:
          type: [integer, "null"]
        chain:
          $ref: "#/components/schemas/ChainRecord"
    PolicyBucket:
      type: object
      required: [name, budgetCents, period, perTxLimitCents, approvalThresholdCents]
      properties:
        name:
          type: string
        budgetCents:
          type: integer
          description: Everything put into the bucket so far (available + held + spent).
        period:
          type: [string, "null"]
          enum: [week, month, null]
        perTxLimitCents:
          type: [integer, "null"]
        approvalThresholdCents:
          type: [integer, "null"]
    PolicyTimeWindow:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          description: 24-hour HH:MM. An end before the start wraps past midnight.
        end:
          type: string
    FamilyPolicy:
      type: object
      description: The API's FamilyPolicy shape (the AI policy builder's output).
      required:
        - buckets
        - blockedCategories
        - approvalThresholdCents
        - timeWindows
        - blockedMerchants
        - allowedMerchants
      properties:
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/PolicyBucket"
        blockedCategories:
          type: array
          items:
            type: string
        approvalThresholdCents:
          type: [integer, "null"]
          description: Family-wide "ask me before anything over" amount.
        timeWindows:
          type: array
          description: Purchases inside any window need a parent's approval.
          items:
            $ref: "#/components/schemas/PolicyTimeWindow"
        blockedMerchants:
          type: array
          items:
            type: string
        allowedMerchants:
          type: array
          description: Allowed merchants are never sent to the AI guard.
          items:
            type: string
    PolicyView:
      type: object
      required: [familyId, presetName, timeZone, policy]
      properties:
        familyId:
          type: integer
        presetName:
          type: string
        timeZone:
          type: string
          description: IANA time zone the time windows are read in.
        policy:
          $ref: "#/components/schemas/FamilyPolicy"

    BucketIcon:
      type: string
      enum: [food, school, social, transit]
    BucketSummary:
      description: >-
        A bucket with the extra numbers the screens show: total funded, spent
        this week and who funded it.
      type: object
      required:
        - id
        - name
        - purpose
        - icon
        - perPurchaseLimitCents
        - approvalThresholdCents
        - availableCents
        - heldCents
        - spentCents
        - fundedCents
        - spentThisWeekCents
        - funderNames
        - chain
      properties:
        id:
          type: integer
        name:
          type: string
        purpose:
          type: [string, "null"]
          description: One short line about what the bucket is for.
        icon:
          description: Which icon to draw; null means no specific icon.
          oneOf:
            - $ref: "#/components/schemas/BucketIcon"
            - type: "null"
        perPurchaseLimitCents:
          type: integer
        approvalThresholdCents:
          type: integer
        availableCents:
          type: integer
        heldCents:
          type: integer
          description: Authorized but not yet settled.
        spentCents:
          type: integer
          description: Settled, all time.
        fundedCents:
          type: integer
          description: Total ever added to this bucket.
        spentThisWeekCents:
          type: integer
          description: Settled in the last 7 days.
        funderNames:
          type: array
          description: Display names of everyone who has added money, in order of first contribution.
          items:
            type: string
        chain:
          $ref: "#/components/schemas/ChainRecord"

    ParentOverview:
      type: object
      required:
        - familyName
        - parentName
        - dependentName
        - potTotalCents
        - buckets
        - pendingApprovalsCount
        - heldPurchasesCount
        - heldTotalCents
        - latestSettlementId
      properties:
        familyName:
          type: string
        parentName:
          type: string
        dependentName:
          type: string
        potTotalCents:
          type: integer
          description: Money still in the pot (available plus held) across all buckets.
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/BucketSummary"
        pendingApprovalsCount:
          type: integer
        heldPurchasesCount:
          type: integer
          description: Approved purchases still held, waiting for settlement.
        heldTotalCents:
          type: integer
        latestSettlementId:
          type: [integer, "null"]
          description: The most recent settlement run, if any.

    TimelineStep:
      type: object
      required: [label, state, at]
      properties:
        label:
          type: string
        state:
          type: string
          enum: [pending, approved, rejected, settled]
        at:
          type: [string, "null"]
          format: date-time
    ActivityItem:
      type: object
      required:
        - id
        - kind
        - occurredAt
        - actorName
        - summary
        - detail
        - amountCents
        - direction
        - decision
        - reasonCode
        - decidedBy
        - bucketName
        - merchantName
        - mcc
        - category
        - timeline
        - settlement
        - chain
        - captureChain
      properties:
        id:
          type: string
          description: Stable row key, e.g. "purchase-12" or "contribution-3".
        kind:
          type: string
          enum: [purchase, contribution]
        occurredAt:
          type: string
          format: date-time
        actorName:
          type: string
        summary:
          type: string
          description: One plain-English sentence describing the row.
        detail:
          type: [string, "null"]
          description: >-
            The decision reason for a purchase, or the note for a
            contribution.
        amountCents:
          type: integer
          description: Always positive; see direction.
        direction:
          type: string
          enum: [in, out]
        decision:
          oneOf:
            - $ref: "#/components/schemas/Decision"
            - type: "null"
        reasonCode:
          oneOf:
            - $ref: "#/components/schemas/ReasonCode"
            - type: "null"
        decidedBy:
          oneOf:
            - $ref: "#/components/schemas/DecidedBy"
            - type: "null"
        bucketName:
          type: [string, "null"]
        merchantName:
          type: [string, "null"]
        mcc:
          type: [string, "null"]
        category:
          type: [string, "null"]
        timeline:
          type: array
          description: Approval chain steps (empty unless the purchase needed a parent's OK).
          items:
            $ref: "#/components/schemas/TimelineStep"
        settlement:
          oneOf:
            - $ref: "#/components/schemas/SettlementState"
            - type: "null"
        chain:
          $ref: "#/components/schemas/ChainRecord"
        captureChain:
          description: >-
            A purchase's capture at settlement (the vault repaying the card
            issuer); `not_submitted` for contributions.
          $ref: "#/components/schemas/ChainRecord"

    PolicyLine:
      type: object
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [block, ask, limit, time]
        text:
          type: string
    BucketRule:
      type: object
      required: [bucketName, perPurchaseLimitCents, approvalThresholdCents]
      properties:
        bucketName:
          type: string
        perPurchaseLimitCents:
          type: integer
        approvalThresholdCents:
          type: integer
    PolicySummary:
      type: object
      description: The family's stored policy, summarized for the card & policy screen.
      required: [presetName, timeZone, bucketRules, lines, updatedAt]
      properties:
        presetName:
          type: string
          description: The preset the policy started from, e.g. "Balanced".
        timeZone:
          type: string
          description: IANA time zone the time windows are read in.
        bucketRules:
          type: array
          items:
            $ref: "#/components/schemas/BucketRule"
        lines:
          type: array
          description: The policy as short plain-English lines for the policy card.
          items:
            $ref: "#/components/schemas/PolicyLine"
        updatedAt:
          type: string
          format: date-time
    BlockedCategory:
      type: object
      required: [category, label]
      properties:
        category:
          type: string
        label:
          type: string
          description: Plain-English name, e.g. "Liquor stores".
    CardAndPolicy:
      type: object
      required: [card, policy, blockedCategories]
      properties:
        card:
          $ref: "#/components/schemas/Card"
        policy:
          $ref: "#/components/schemas/PolicySummary"
        blockedCategories:
          type: array
          items:
            $ref: "#/components/schemas/BlockedCategory"

    DependentWallet:
      type: object
      required: [dependent, card, totalAvailableCents, buckets]
      properties:
        dependent:
          $ref: "#/components/schemas/Member"
        card:
          $ref: "#/components/schemas/Card"
        totalAvailableCents:
          type: integer
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/BucketSummary"
