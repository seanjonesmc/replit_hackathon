kind = "web"
previewPath = "/"
title = "Trellis"
description = "Family money with guardrails. Phase 0: central branding, reusable components, and a development brand preview."
version = "1.0.0"
id = "artifacts/trellis"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20757

[services.development]
run = "pnpm --filter @workspace/trellis run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trellis", "run", "build" ]
serve = "static"
publicDir = "artifacts/trellis/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20757"
BASE_PATH = "/"
